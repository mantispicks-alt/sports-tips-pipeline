name: the site ingest + settle

on:
  schedule:
    # Every 2 hours. GitHub cron is UTC. Ingestion is cheap (~2-4 cents/run)
    # and picks don't change fast enough to need tighter than this.
    - cron: '0 */2 * * *'
  workflow_dispatch: {} # lets you click "Run workflow" manually on GitHub too

# Only one run at a time — a second run mid-flight would race on the same
# data files and the git push at the end.
concurrency:
  group: the-site-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Every secret below must exist in this repo's Settings -> Secrets and
      # variables -> Actions -> "New repository secret". Values are encrypted
      # by GitHub, never visible in logs or to anyone without admin access.
      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          LLM_PROVIDER=openai
          LLM_PROVIDERS=openai,groq,gemini,cerebras,mistral,openrouter
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          API_SPORTS_KEY=${{ secrets.API_SPORTS_KEY }}
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION=${{ secrets.TELEGRAM_SESSION }}
          EOF

      - name: Refresh sites (scrape + LLM extract)
        run: node scripts/refresh-sites.mjs --allow-unofficial
        continue-on-error: true # one bad run shouldn't block telegram/settle below

      - name: Refresh Telegram channels
        run: node scripts/refresh-telegram.mjs
        continue-on-error: true

      - name: Settle real results
        run: node scripts/settle-real.mjs
        continue-on-error: true

      - name: Remove .env before commit (never commit secrets)
        run: rm -f .env

      - name: Commit updated data back to the repo
        run: |
          git config user.name "the-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/tips/ src/data/real-history.json src/data/real-outcomes.json
          git diff --cached --quiet && echo "No data changes." || git commit -m "Auto-refresh tips + settle real results [skip ci]"
          git push
