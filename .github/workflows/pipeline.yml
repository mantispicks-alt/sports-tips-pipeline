name: the site ingest + settle

on:
  schedule:
    # Backup trigger. GitHub cron is UTC and BEST-EFFORT — it drops/delays runs
    # on private repos, so a Cloudflare Worker also fires this via
    # workflow_dispatch every 2h (reliable). Keeping both is belt-and-suspenders.
    - cron: '0 */2 * * *'
  workflow_dispatch: {} # manual run + the Worker's reliable 2h trigger

# Default GITHUB_TOKEN is read-only unless a job explicitly asks for write —
# needed so the final "commit data back" step can push.
permissions:
  contents: write

# Only one run at a time — a second run mid-flight would race on the same
# data files and the git push at the end.
concurrency:
  group: the-site-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8 # a hung download must fail the step, not the whole job

      # Every secret below must exist in this repo's Settings -> Secrets and
      # variables -> Actions -> "New repository secret". Values are encrypted
      # by GitHub, never visible in logs or to anyone without admin access.
      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          LLM_PROVIDER=openai
          LLM_PROVIDERS=openai,groq,gemini,cerebras,mistral,openrouter
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          API_SPORTS_KEY=${{ secrets.API_SPORTS_KEY }}
          HIGHLIGHTLY_API_KEY=${{ secrets.HIGHLIGHTLY_API_KEY }}
          FOOTBALL_DATA_ORG_KEY=${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          ODDS_API_IO_KEY=${{ secrets.ODDS_API_IO_KEY }}
          THE_ODDS_API_KEY=${{ secrets.THE_ODDS_API_KEY }}
          BRAVE_SEARCH_API_KEY=${{ secrets.BRAVE_SEARCH_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION=${{ secrets.TELEGRAM_SESSION }}
          EOF

      # Every network step below is time-boxed and continue-on-error: a single
      # hung/slow provider must never stall the job to a 15-min forced cancel
      # (which is what was killing scheduled runs before).
      - name: Refresh sites (scrape + LLM extract)
        run: node scripts/refresh-sites.mjs --allow-unofficial
        timeout-minutes: 12
        continue-on-error: true

      - name: Refresh Telegram channels
        run: node scripts/refresh-telegram.mjs
        timeout-minutes: 8
        continue-on-error: true

      # Independent tipster sites (public pages, LLM-extracted). This was
      # written but never wired into the cron, so the 16 real-<tipster>.json
      # snapshots sat empty — the same unofficial-scrape profile as
      # refresh-sites above, which already runs here. ~14 tipsters / ~80 picks.
      - name: Refresh tipster sites (LLM-extract public picks)
        run: node scripts/refresh-tips.mjs --allow-unofficial
        timeout-minutes: 10
        continue-on-error: true

      # Sharp value engine: Pinnacle-anchored +EV picks at the best bookmaker
      # odds. One credit per league; rotates THE_ODDS_API_KEY keys.
      - name: Refresh sharp odds (value picks)
        run: node scripts/refresh-odds.mjs
        timeout-minutes: 6
        continue-on-error: true

      - name: Settle real results
        run: node scripts/settle-real.mjs
        timeout-minutes: 6
        continue-on-error: true

      - name: Build reference DB (harvest own data + API-Football if key set)
        run: npx tsx scripts/build-reference.ts
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        timeout-minutes: 8
        continue-on-error: true

      - name: Generate tip content (bridges aggregation -> src/content/tips)
        run: npx tsx scripts/generate-tip-content.ts
        timeout-minutes: 6
        continue-on-error: true

      - name: Remove .env before commit (never commit secrets)
        run: rm -f .env

      - name: Commit updated data back to the repo
        run: |
          git config user.name "the-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/tips/ src/data/real-history.json src/data/real-outcomes.json src/data/web-settle-attempts.json src/data/ingest-cache.json src/content/tips/ src/data/reference/ src/data/llm-usage.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-refresh tips + settle real results [skip ci]"
            # master can advance during the ~8-min run (a manual push, or drift):
            # a plain push would then be rejected and fail the whole run, losing
            # this run's deploy. Rebase our generated-data commit on top and
            # retry instead. Data files are regenerated each run, so an unrelated
            # commit rebases cleanly; only a true same-line conflict still fails.
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push rejected — rebasing on latest and retrying ($i/3)"
              git pull --rebase --autostash --no-edit origin master || break
            done
            [ "$pushed" = 1 ] || { echo "push failed after retries"; exit 1; }
          fi

      # ---- Deploy the site so fresh data actually reaches visitors ----
      # Cloudflare Pages is NOT git-connected, so without this step new data
      # would sit in the repo and never show up live. Rebuild + push to the
      # production branch (main) of the the-site-tips Pages project.
      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages (live)
        if: ${{ success() }}
        run: npx wrangler pages deploy dist/ --project-name=the-site-tips --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "REDACTED-CF-ACCOUNT-ID"
        continue-on-error: true # stays green until the CLOUDFLARE_API_TOKEN secret is added
