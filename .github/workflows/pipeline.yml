name: the site ingest + settle

on:
  # No `schedule:` on purpose. This repo is PRIVATE = 2000 free Actions min/month.
  # The Cloudflare Worker is the SINGLE trigger (every 3h — the max that fits the
  # free budget). A second GitHub cron would double the runs and blow the month's
  # minutes (which is exactly what froze the site before). Trigger manually or let
  # the Worker fire it.
  workflow_dispatch: {}

# Default GITHUB_TOKEN is read-only unless a job explicitly asks for write —
# needed so the final "commit data back" step can push.
permissions:
  contents: write

# Only one run at a time — a second run mid-flight would race on the same
# data files and the git push at the end.
concurrency:
  group: the-site-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # reuse the ~/.npm download cache across runs -> faster npm ci

      - name: Install dependencies
        run: npm ci

      # Cache the Playwright browser binary so it isn't re-downloaded every run
      # (~25s saved on a hit). Keyed on the lockfile so a Playwright version bump
      # busts it. The install step still runs to lay down system deps, but it's
      # near-instant when the browser is already cached.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8 # a hung download must fail the step, not the whole job

      # Every secret below must exist in this repo's Settings -> Secrets and
      # variables -> Actions -> "New repository secret". Values are encrypted
      # by GitHub, never visible in logs or to anyone without admin access.
      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          LLM_PROVIDER=openai
          LLM_PROVIDERS=openai,groq,gemini,cerebras,mistral,openrouter
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          API_SPORTS_KEY=${{ secrets.API_SPORTS_KEY }}
          HIGHLIGHTLY_API_KEY=${{ secrets.HIGHLIGHTLY_API_KEY }}
          HIGHLIGHTLY_PAID=${{ secrets.HIGHLIGHTLY_PAID }}
          FOOTBALL_DATA_ORG_KEY=${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          ODDS_API_IO_KEY=${{ secrets.ODDS_API_IO_KEY }}
          THE_ODDS_API_KEY=${{ secrets.THE_ODDS_API_KEY }}
          BZZOIRO_API_KEY=${{ secrets.BZZOIRO_API_KEY }}
          BRAVE_SEARCH_API_KEY=${{ secrets.BRAVE_SEARCH_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION=${{ secrets.TELEGRAM_SESSION }}
          EOF

      # Every network step below is time-boxed and continue-on-error: a single
      # hung/slow provider must never stall the job to a 15-min forced cancel
      # (which is what was killing scheduled runs before).
      - name: Refresh sites (scrape + LLM extract)
        run: node scripts/refresh-sites.mjs --allow-unofficial
        timeout-minutes: 12
        continue-on-error: true

      - name: Refresh Telegram channels
        run: node scripts/refresh-telegram.mjs
        timeout-minutes: 8
        continue-on-error: true

      # Independent tipster sites (public pages, LLM-extracted). This was
      # written but never wired into the cron, so the 16 real-<tipster>.json
      # snapshots sat empty — the same unofficial-scrape profile as
      # refresh-sites above, which already runs here. ~14 tipsters / ~80 picks.
      - name: Refresh tipster sites (LLM-extract public picks)
        run: node scripts/refresh-tips.mjs --allow-unofficial
        timeout-minutes: 10
        continue-on-error: true

      # Sharp value engine: Pinnacle-anchored +EV picks at the best bookmaker
      # odds. One credit per league; rotates THE_ODDS_API_KEY keys.
      - name: Refresh sharp odds (value picks)
        run: node scripts/refresh-odds.mjs
        timeout-minutes: 6
        continue-on-error: true

      # ClubElo REMOVED 2026-08-21 — its data API (api.clubelo.com/Fixtures) now
      # blocks/hangs automated fetches (root 403, data endpoints time out) both in
      # CI and locally, so it wrote nothing and burned ~20s/run on the timeout. Its
      # Elo 1X2 signal is superseded by Pinnacle (1X2 across 211 leagues). Re-add
      # scripts/refresh-clubelo.mjs here if the API ever recovers.

      # Pinnacle as a sharp model source — NO key, unlimited (Pinnacle's own
      # public web backend). ~600 favorite picks across ~180 leagues incl. tiny
      # ones — the sharpest signal in the consensus. Offline-safe: a break here
      # never touches the licensed Odds API value engine.
      - name: Refresh Pinnacle sharp picks
        run: node scripts/refresh-pinnacle.mjs
        timeout-minutes: 4
        continue-on-error: true

      # football-data.co.uk — NO key, unlimited, free. Two independent signals for
      # SMALL leagues (English lower, Scottish lower, D2/F2/SP2 + Argentina/Brazil/
      # Denmark/Finland/Ireland/Japan/Norway/Poland/Romania/Sweden/USA …):
      #   FD Odds    de-margined bookmaker consensus -> 1X2 + Over/Under 2.5
      #              (our FIRST O/U model signal for small leagues)
      #   FD Poisson team-strength model from the provider's own season results
      #              -> O/U 2.5 + BTTS + 1X2, independent of the odds.
      # Offline-safe: any failure writes nothing, never wipes a good snapshot.
      - name: Refresh football-data.co.uk (odds + Poisson, small leagues)
        run: node scripts/refresh-fdcouk.mjs
        timeout-minutes: 5
        continue-on-error: true

      # BSD (Bzzoiro Sports Data) — free, NO rate limits (needs BZZOIRO_API_KEY).
      # De-vigged market-consensus odds for 1X2 + O/U 2.5 + BTTS across ~48
      # leagues. Standout value = REAL BTTS market prices (previously BTTS was
      # only the FD Poisson approximation). Offline-safe: empty key / any failure
      # writes nothing, exit 0.
      - name: Refresh BSD (Bzzoiro market odds — 1X2/OU/BTTS)
        run: node scripts/refresh-bzzoiro.mjs
        timeout-minutes: 4
        continue-on-error: true

      - name: Settle real results
        run: node scripts/settle-real.mjs
        timeout-minutes: 6
        continue-on-error: true

      # Harvest-only: builds src/data/reference/teams.json (name dictionary +
      # aliases) from our OWN scraped tips — free, no key, covers small leagues.
      # The API-Football augmentation is disabled (--no-api): that account is
      # SUSPENDED, so it added ~1.5-2 min of dead 7s-sleeps per run for nothing.
      # It only ever added canonical names for ~14 top leagues, which we no longer
      # need (consensusGroupKey handles spelling variants + fuzzy settlement joins).
      # Re-enable by dropping --no-api once a working API_SPORTS_KEY exists.
      - name: Build reference DB (harvest own data)
        run: npx tsx scripts/build-reference.ts --no-api
        timeout-minutes: 4
        continue-on-error: true

      - name: Generate tip content (bridges aggregation -> src/content/tips)
        run: npx tsx scripts/generate-tip-content.ts
        timeout-minutes: 6
        continue-on-error: true

      - name: Remove .env before commit (never commit secrets)
        run: rm -f .env

      - name: Commit updated data back to the repo
        run: |
          git config user.name "the-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/tips/ src/data/real-history.json src/data/real-outcomes.json src/data/web-settle-attempts.json src/data/ingest-cache.json src/data/best-odds.json src/data/clv.json src/data/pinnacle-moves.json src/data/fixtures-cache.json src/content/tips/ src/data/reference/ src/data/llm-usage.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-refresh tips + settle real results [skip ci]"
            # master can advance during the ~8-min run (a manual push, or drift):
            # a plain push would then be rejected and fail the whole run, losing
            # this run's deploy. Rebase our generated-data commit on top and
            # retry instead. Data files are regenerated each run, so an unrelated
            # commit rebases cleanly; only a true same-line conflict still fails.
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push rejected — rebasing on latest and retrying ($i/3)"
              if ! git pull --rebase --autostash --no-edit origin master; then
                # A concurrent run pushed its own regenerated data — the rebase
                # conflicts on machine-generated files (ingest-cache.json,
                # llm-usage.json rewrite fully every run, so they ALWAYS clash
                # when two runs overlap). These aren't hand-edited: keep THIS
                # run's version and any other still-conflicted data file, then
                # continue. Prevents a race from silently skipping the deploy.
                for f in $(git diff --name-only --diff-filter=U); do
                  git checkout --theirs -- "$f" 2>/dev/null && git add -- "$f"
                done
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              fi
            done
            [ "$pushed" = 1 ] || { echo "push failed after retries"; exit 1; }
          fi

      # ---- Deploy the site so fresh data actually reaches visitors ----
      # Cloudflare Pages is NOT git-connected, so without this step new data
      # would sit in the repo and never show up live. Rebuild + push to the
      # production branch (main) of the the-site-tips Pages project.
      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages (live)
        if: ${{ success() }}
        run: npx wrangler pages deploy dist/ --project-name=the-site-tips --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "REDACTED-CF-ACCOUNT-ID"
        continue-on-error: true # stays green until the CLOUDFLARE_API_TOKEN secret is added
